name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Versi / Label (contoh: v1.0.3 atau test-1)"
        required: false
        default: "preview"
        type: string
  push:
    tags:
      - "v*.*.*"

jobs:
  build-ios:
    name: Build iOS IPA (Unsigned)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.x"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app to .ipa
        run: |
          mkdir -p dist
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r dist/virya-ios.ipa Payload
          rm -rf Payload

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: virya-ios-${{ github.ref_name || inputs.tag || 'preview' }}
          path: dist/virya-ios.ipa
          retention-days: 14

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/virya-ios.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

