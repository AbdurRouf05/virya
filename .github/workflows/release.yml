name: Build & Release APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag versi (contoh: v1.0.3)"
        required: true
        type: string

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.x"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build APK (release)
        run: flutter build apk --release --split-per-abi

      - name: Rename APK
        run: |
          TAG=${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/virya-${TAG}-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/virya-${TAG}-arm32.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/virya-${TAG}-x86_64.apk

      - name: Upload APK sebagai artifact (untuk preview)
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.ref_name }}
          path: dist/
          retention-days: 7

      - name: Publish ke GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          name: "Virya ${{ github.ref_name }}"
          body: |
            ## Download

            Pilih APK sesuai perangkat lu:

            | File | Perangkat |
            |------|-----------|
            | `virya-*-arm64.apk` | HP modern (2016+), Infinix, Samsung, Xiaomi, dll |
            | `virya-*-arm32.apk` | HP lama 32-bit |
            | `virya-*-x86_64.apk` | Emulator / PC Android |

            Sebagian besar pengguna download `arm64`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Telegram Release Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not configured, skipping notification."
            exit 0
          fi

          STATUS="${{ job.status }}"
          REPO="${{ github.repository }}"
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG}"
          RUN_URL="https://github.com/${REPO}/actions/runs/${{ github.run_id }}"

          if [ "$STATUS" = "success" ]; then
            MESSAGE="🚀 <b>Virya ${TAG} Berhasil Dirilis!</b>%0A%0A"
            MESSAGE="${MESSAGE}📦 <b>File APK:</b> arm64, arm32, x86_64 sudah terunggah.%0A"
            MESSAGE="${MESSAGE}📥 <a href='${RELEASE_URL}'>Download APK di GitHub Releases</a>"
          else
            MESSAGE="❌ <b>Build Rilis ${TAG} Gagal!</b>%0A%0A"
            MESSAGE="${MESSAGE}⚠️ Cek log kegagalan build: <a href='${RUN_URL}'>Lihat Log</a>"
          fi

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "text=${MESSAGE}"

