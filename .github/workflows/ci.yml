name: CI (Code Quality & Tests)

on:
  push:
    branches:
      - main
      - dev1
  pull_request:
    branches:
      - main
      - dev1
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.x"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code (dart analyze)
        run: dart analyze

      - name: Run test suite (flutter test)
        run: flutter test

      - name: Send Telegram Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not configured, skipping notification."
            exit 0
          fi

          STATUS="${{ job.status }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          ACTOR="${{ github.actor }}"
          RUN_URL="https://github.com/${REPO}/actions/runs/${{ github.run_id }}"

          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"
            TITLE="<b>${EMOJI} CI Berhasil — Virya</b>"
            DESC="🎉 Analisis kode & 624 unit test lulus 100%!"
          else
            EMOJI="❌"
            TITLE="<b>${EMOJI} CI Gagal — Virya</b>"
            DESC="⚠️ Ditemukan masalah pada kode atau unit test."
          fi

          MESSAGE="${TITLE}%0A%0A"
          MESSAGE="${MESSAGE}🌿 <b>Branch:</b> <code>${BRANCH}</code>%0A"
          MESSAGE="${MESSAGE}👤 <b>Pusher:</b> ${ACTOR}%0A"
          MESSAGE="${MESSAGE}📝 <b>Status:</b> ${DESC}%0A%0A"
          MESSAGE="${MESSAGE}🔗 <a href='${RUN_URL}'>Lihat Log di GitHub Actions</a>"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "text=${MESSAGE}"

