name: Build & Release APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag versi (contoh: v1.0.3)"
        required: true
        type: string

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.x"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Siapkan kunci release
        env:
          KEYSTORE_BASE64: ${{ secrets.VIRYA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret VIRYA_KEYSTORE_BASE64 belum diatur. APK rilis harus ditandatangani kunci resmi."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/virya-upload.jks"
          echo "VIRYA_KEYSTORE_PATH=$RUNNER_TEMP/virya-upload.jks" >> "$GITHUB_ENV"

      - name: Build APK Universal (release)
        env:
          VIRYA_KEYSTORE_PASSWORD: ${{ secrets.VIRYA_KEYSTORE_PASSWORD }}
          VIRYA_KEY_ALIAS: ${{ secrets.VIRYA_KEY_ALIAS }}
          VIRYA_KEY_PASSWORD: ${{ secrets.VIRYA_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Hapus kunci dari runner
        if: always()
        run: rm -f "$RUNNER_TEMP/virya-upload.jks"

      - name: Siapkan file APK rilis
        run: |
          TAG=${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/virya-${TAG}.apk"
          echo "APK_PATH=dist/virya-${TAG}.apk" >> "$GITHUB_ENV"

      - name: Verifikasi struktur, signature & kompatibilitas APK
        run: |
          set -e
          BUILD_TOOLS=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          echo "Using build-tools: $BUILD_TOOLS"

          echo "=== 1. Zipalign (4-byte + 16KB page compatibility) ==="
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK_PATH" | tail -n 5

          echo "=== 2. Signature Check (wajib kunci release resmi) ==="
          SIGN_OUT=$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK_PATH")
          echo "$SIGN_OUT"
          if echo "$SIGN_OUT" | grep -q "CN=Android Debug"; then
            echo "::error::APK rilis tertandatangani oleh debug key!"
            exit 1
          fi

          echo "=== 3. Manifest & Universal ABI Check ==="
          BADGING=$("$BUILD_TOOLS/aapt2" dump badging "$APK_PATH")
          echo "$BADGING" | grep -E "package:|sdkVersion:|native-code:|uses-feature"
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            if ! echo "$BADGING" | grep -q "$ABI"; then
              echo "::error::ABI $ABI tidak ditemukan di APK universal!"
              exit 1
            fi
          done

      - name: Upload APK sebagai artifact (untuk verifikasi & preview)
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.ref_name }}
          path: dist/
          retention-days: 7

  verify-install:
    name: Verify APK Install (Android Emulator)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: apk-${{ github.ref_name }}
          path: dist/

      - name: Aktifkan izin KVM untuk Emulator
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -la /dev/kvm
          else
            echo "::warning::/dev/kvm tidak tersedia di runner ini."
          fi

      - name: Test Install & Launch APK di Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -e
            APK_PATH=$(ls dist/virya-*.apk | head -n 1)
            echo "Testing APK: $APK_PATH"
            adb uninstall com.abdurrouf.virya || true
            adb install "$APK_PATH"
            adb shell pm path com.abdurrouf.virya
            adb shell dumpsys package com.abdurrouf.virya | grep -E "versionCode|versionName"
            adb install -r "$APK_PATH"
            adb logcat -c
            adb shell am start -W -n com.abdurrouf.virya/.MainActivity
            sleep 6
            PID=$(adb shell pidof com.abdurrouf.virya || true)
            echo "App PID: $PID"
            if [ -z "$PID" ]; then
              echo "::error::Aplikasi tidak berjalan setelah diluncurkan!"
              adb logcat -d | tail -n 100
              exit 1
            fi
            if adb logcat -d | grep -E "FATAL EXCEPTION|AndroidRuntime.*com\.abdurrouf\.virya"; then
              echo "::error::Terdeteksi crash saat aplikasi dijalankan!"
              adb logcat -d | tail -n 100
              exit 1
            fi
            echo "APK berhasil di-install, di-upgrade, dan dijalankan tanpa crash!"

  publish:
    name: Publish GitHub Release
    needs: [build, verify-install]
    if: always() && needs.build.result == 'success' && needs.verify-install.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: apk-${{ github.ref_name }}
          path: dist/

      - name: Bersihkan asset APK lama pada release tag yang sama (jika ada)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 - << 'EOF'
          import json, os, urllib.request, urllib.error

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["REPO"]
          tag = os.environ["TAG"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "virya-release-bot",
          }
          url = f"https://api.github.com/repos/{repo}/releases/tags/{tag}"
          try:
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as resp:
                  rel = json.loads(resp.read().decode("utf-8"))
          except urllib.error.HTTPError as e:
              if e.code == 404:
                  print("No existing release for tag, skipping cleanup.")
                  raise SystemExit(0)
              raise

          for asset in rel.get("assets", []):
              if asset["name"].endswith(".apk"):
                  del_url = f"https://api.github.com/repos/{repo}/releases/assets/{asset['id']}"
                  req = urllib.request.Request(del_url, headers=headers, method="DELETE")
                  with urllib.request.urlopen(req):
                      print(f"Deleted stale asset: {asset['name']}")
          EOF

      - name: Publish ke GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          name: "Virya ${{ github.ref_name }}"
          body: |
            ## Download

            Download file **`virya-${{ github.ref_name }}.apk`** (Universal APK — mendukung semua HP Android: arm64, arm32, dan x86_64, serta telah lolos verifikasi signature & uji install di Android Emulator).

            > **Catatan Penting untuk pengguna v1.0.4 ke bawah:**
            > Mulai v1.0.5, APK ditandatangani menggunakan kunci rilis permanen baru agar update berikutnya berjalan mulus. Jika lu meng-update dari **v1.0.4 atau lebih lama**, lakukan **Pengaturan → Buat cadangan** terlebih dahulu, **uninstall versi lama sekali**, lalu install APK v1.0.5 ini.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Telegram Release Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 -c "
          import os, sys, json, urllib.request

          token = os.environ.get('TELEGRAM_BOT_TOKEN', '').strip()
          chat_id = os.environ.get('TELEGRAM_CHAT_ID', '').strip()
          if not token or not chat_id:
              print('⚠️ Telegram secrets not configured, skipping.')
              sys.exit(0)

          status = os.environ.get('STATUS', '')
          tag = os.environ.get('TAG', '')
          repo = os.environ.get('REPO', '')
          run_id = os.environ.get('RUN_ID', '')
          release_url = f'https://github.com/{repo}/releases/tag/{tag}'
          run_url = f'https://github.com/{repo}/actions/runs/{run_id}'

          if status == 'success':
              title = f'🚀 <b>Virya {tag} Berhasil Dirilis!</b>'
              body = f'📦 <b>Universal APK:</b> Lolos verifikasi signature, zipalign, & uji install Android Emulator.\n📥 <a href=\"{release_url}\">Download APK di GitHub Releases</a>'
          else:
              title = f'❌ <b>Build Rilis {tag} Gagal!</b>'
              body = f'⚠️ Cek log kegagalan build: <a href=\"{run_url}\">Lihat Log</a>'

          text = f'{title}\n\n{body}'
          data = json.dumps({
              'chat_id': chat_id,
              'text': text,
              'parse_mode': 'HTML',
              'disable_web_page_preview': True
          }).encode('utf-8')

          req = urllib.request.Request(
              f'https://api.telegram.org/bot{token}/sendMessage',
              data=data,
              headers={'Content-Type': 'application/json'}
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  result = json.loads(resp.read().decode('utf-8'))
                  print('✅ Telegram response:', result)
          except Exception as e:
              print(f'❌ Telegram send error: {e}')
          "

