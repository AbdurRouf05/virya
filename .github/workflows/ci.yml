name: "CI & DevSecOps (Quality, Security & Tests)"

on:
  push:
    branches:
      - main
      - dev1
  pull_request:
    branches:
      - main
      - dev1
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: "Lint, Security & Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: DevSecOps - Secret Leak Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.x"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: DevSecOps - Dependency Audit
        run: dart pub outdated --no-dev-dependencies

      - name: SAST & Lint (dart analyze)
        run: dart analyze

      - name: Run test suite (flutter test)
        run: flutter test

      - name: Send Telegram Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 -c "
          import os, sys, json, urllib.request

          token = os.environ.get('TELEGRAM_BOT_TOKEN', '').strip()
          chat_id = os.environ.get('TELEGRAM_CHAT_ID', '').strip()
          if not token or not chat_id:
              print('⚠️ Telegram secrets not configured (TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is empty), skipping.')
              sys.exit(0)

          status = os.environ.get('STATUS', '')
          branch = os.environ.get('BRANCH', '')
          actor = os.environ.get('ACTOR', '')
          run_url = os.environ.get('RUN_URL', '')

          if status == 'success':
              title = '✅ <b>CI + DevSecOps Berhasil — Virya</b>'
              desc = '🎉 Kode lolos audit keamanan (SAST + Secret Scan) dan 624 unit test lulus 100%!'
          else:
              title = '❌ <b>CI + DevSecOps Gagal — Virya</b>'
              desc = '⚠️ Ditemukan masalah pada kode, audit keamanan, atau unit test.'

          text = f'{title}\n\n🌿 <b>Branch:</b> <code>{branch}</code>\n👤 <b>Pusher:</b> {actor}\n🛡️ <b>Security:</b> SAST + Gitleaks Secret Scan\n📝 <b>Status:</b> {desc}\n\n🔗 <a href=\"{run_url}\">Lihat Log di GitHub Actions</a>'

          data = json.dumps({
              'chat_id': chat_id,
              'text': text,
              'parse_mode': 'HTML',
              'disable_web_page_preview': True
          }).encode('utf-8')

          req = urllib.request.Request(
              f'https://api.telegram.org/bot{token}/sendMessage',
              data=data,
              headers={'Content-Type': 'application/json'}
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  result = json.loads(resp.read().decode('utf-8'))
                  if result.get('ok'):
                      print('✅ Telegram notification successfully sent!')
                  else:
                      print('⚠️ Telegram response:', result)
          except Exception as e:
              print(f'❌ Telegram send error: {e}')
          "
