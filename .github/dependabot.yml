version: 2
updates:
  # DevSecOps: Pemindaian keamanan berkala untuk dependencies Flutter / Dart
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"

  # DevSecOps: Pemindaian keamanan berkala untuk GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "ci"
      - "security"
