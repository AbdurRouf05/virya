name: CI (Code Quality & Tests)

on:
  push:
    branches:
      - main
      - dev1
  pull_request:
    branches:
      - main
      - dev1
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.x"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code (dart analyze)
        run: dart analyze

      - name: Run test suite (flutter test)
        run: flutter test
